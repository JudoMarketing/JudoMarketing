<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Judo Marketing · Tarjeta de presentación</title>
<!--
  Tarjeta de presentación de Junior Osorio (octubre de 2026), para imprimir
  en PVC negro. Se dibuja a tamaño real en milímetros y la convierte en PDF
  docs/tarjetas/generar.mjs. Parámetros en la dirección:

    ?lado=frente|dorso   la cara
    &tam=cr80|us         cr80: 85.6 x 54 mm (la de plástico, como una tarjeta
                         de crédito). us: 3.5 x 2 in (88.9 x 50.8 mm).
    &capa=color|blanco   color: el arte. blanco: la placa de tinta blanca
                         (negro = donde va tinta blanca debajo del color).
    &guias=1             muestra corte y zona segura (solo para revisar).

  En PVC negro el fondo NO se imprime: es el plástico. Todo lo que debe verse
  vivo lleva tinta blanca debajo. La huella del frente va a propósito SIN
  blanco: queda tono sobre tono, se ve con la luz, como un relieve.
-->
<!-- Fuentes de la marca, guardadas aquí (licencia OFL en fuentes/) para que el PDF
     salga igual sin internet. -->
<style>
  @font-face { font-family: Poppins; font-weight: 500; src: url(fuentes/Poppins-Medium.ttf); }
  @font-face { font-family: Poppins; font-weight: 600; src: url(fuentes/Poppins-SemiBold.ttf); }
  @font-face { font-family: Poppins; font-weight: 700; src: url(fuentes/Poppins-Bold.ttf); }
  @font-face { font-family: Inter; font-weight: 400; src: url(fuentes/Inter-Regular.ttf); }
  @font-face { font-family: Inter; font-weight: 500; src: url(fuentes/Inter-Medium.ttf); }
  @font-face { font-family: Inter; font-weight: 600; src: url(fuentes/Inter-SemiBold.ttf); }
  :root {
    --sangrado: 3.175mm; /* 1/8 de pulgada */
    --plastico: #0a0a0f;
    --violeta: #7b2dff;
    --lila: #a855f7;
    --texto: #f5f5f7;
    --suave: #c9c6d6;
    --huella: #2a1858;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--plastico); }
  body {
    width: calc(var(--ancho) + 2 * var(--sangrado));
    height: calc(var(--alto) + 2 * var(--sangrado));
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    font-family: Inter, system-ui, sans-serif;
    color: var(--texto);
  }
  @page { margin: 0; }

  /* La tarjeta ya cortada; todo se mide desde aquí */
  .corte {
    position: absolute;
    left: var(--sangrado);
    top: var(--sangrado);
    width: var(--ancho);
    height: var(--alto);
  }
  /* Nada importante a menos de 5.5 mm del corte: aire de tarjeta premium y
     margen de sobra si la imprenta corta o encuadra un poco distinto. */
  .seguro { position: absolute; inset: 5.5mm; }

  .poppins { font-family: Poppins, sans-serif; letter-spacing: -0.022em; }

  /* ── FRENTE ─────────────────────────────────────────────── */
  .huella { position: absolute; left: calc(-1 * var(--sangrado)); top: calc(-1 * var(--sangrado));
    width: calc(var(--ancho) + 2 * var(--sangrado)); height: calc(var(--alto) + 2 * var(--sangrado)); }
  .frente .seguro { display: flex; align-items: center; gap: 5mm; }
  .logo { height: 27mm; width: auto; display: block; flex: none; }
  .lema { margin-left: auto; text-align: right; }
  .lema .uno { font-size: 10.5pt; font-weight: 600; line-height: 1.12; }
  .lema .dos { font-size: 10.5pt; font-weight: 700; line-height: 1.12; color: var(--lila); }
  .lema .raya { width: 8mm; height: 0.45mm; border-radius: 0.25mm; background: var(--violeta); margin: 2.8mm 0 2.6mm auto; }
  .lema .que { list-style: none; font-size: 6.5pt; font-weight: 500; line-height: 1.65; color: var(--suave); white-space: nowrap; }

  /* ── DORSO ──────────────────────────────────────────────── */
  .dorso .seguro { display: flex; gap: 6mm; }
  .izq { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .nombre { font-size: 13pt; font-weight: 600; line-height: 1.05; }
  .cargo { margin-top: 1.3mm; font-size: 6.4pt; font-weight: 600; letter-spacing: 0.24em; color: var(--lila); }
  .frase { font-size: 7.6pt; font-weight: 500; line-height: 1.3; color: var(--suave); }
  .frase b { font-weight: 600; color: var(--lila); }
  .tel { font-family: Poppins, sans-serif; font-size: 10pt; font-weight: 600; letter-spacing: 0.01em; line-height: 1.1; }
  .pie { margin-top: 1mm; font-size: 6pt; font-weight: 500; letter-spacing: 0.06em; color: var(--suave); white-space: nowrap; }

  .der { width: 21mm; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .qr { width: 21mm; height: 21mm; background: #fff; border-radius: 2mm; padding: 1.9mm; }
  .qr img { width: 100%; height: 100%; display: block; }
  .ver { margin-top: 2.2mm; font-size: 7pt; font-weight: 600; text-align: center; line-height: 1.1; white-space: nowrap; }
  .ver span { color: var(--lila); font-family: Inter, sans-serif; font-weight: 600; }

  /* ── PLACA DE TINTA BLANCA ──────────────────────────────── */
  body.blanco { background: #fff; }
  .blanco { --texto: #000; --suave: #000; --lila: #000; --violeta: #000; }
  .blanco .huella { display: none; }
  .blanco .qr { background: #000; }
  /* La placa usa logo-placa.png y qr-placa.svg (sin filtros: así el PDF
     guarda el logo a resolución completa y el QR en vector). */

  /* ── GUÍAS ──────────────────────────────────────────────── */
  .guias .corte { outline: 0.15mm solid #00e5ff; }
  .guias .seguro { outline: 0.15mm dashed #ff3d7f; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const lado = q.get("lado") === "dorso" ? "dorso" : "frente";
  const tam = q.get("tam") === "cr80" ? { ancho: 85.6, alto: 54 } : { ancho: 88.9, alto: 50.8 };
  const raiz = document.documentElement.style;
  raiz.setProperty("--ancho", tam.ancho + "mm");
  raiz.setProperty("--alto", tam.alto + "mm");
  if (q.get("capa") === "blanco") {
    document.body.classList.add("blanco");
    document.documentElement.style.background = "#fff";
  }
  if (q.get("guias") === "1") document.body.classList.add("guias");
  document.body.dataset.lado = lado;
</script>

<!-- FRENTE -->
<div class="corte frente" data-cara="frente">
  <svg class="huella" id="huella" aria-hidden="true"></svg>
  <div class="seguro">
    <img class="logo" src="logo.png" alt="Judo Marketing" />
    <div class="lema">
      <div class="uno poppins">Your business,</div>
      <div class="dos poppins">in good hands.</div>
      <div class="raya"></div>
      <ul class="que">
        <li>Websites &amp; E-commerce</li>
        <li>Delivery &amp; Ordering Apps</li>
        <li>Automations</li>
        <li>Business Advisory</li>
      </ul>
    </div>
  </div>
</div>

<!-- DORSO -->
<div class="corte dorso" data-cara="dorso">
  <svg class="huella" id="huella-dorso" aria-hidden="true"></svg>
  <div class="seguro">
    <div class="izq">
      <div>
        <div class="nombre poppins">Junior Osorio</div>
        <div class="cargo">DIRECTOR</div>
      </div>
      <div class="frase">Complex problems, <b>solved.</b></div>
      <div>
        <div class="tel">+1 305-497-9266</div>
        <div class="pie">judomarketing.net · Miami · EN / ES</div>
      </div>
    </div>
    <div class="der">
      <div class="qr"><img src="qr.svg" alt="QR: judomarketing.net/card" /></div>
      <div class="ver poppins">See our work <span>→</span></div>
    </div>
  </div>
</div>

<script>
  if (document.body.classList.contains("blanco")) {
    for (const i of document.querySelectorAll(".logo")) i.src = "logo-placa.png";
    for (const i of document.querySelectorAll(".qr img")) i.src = "qr-placa.svg";
  }
  // Solo se queda la cara pedida
  for (const c of document.querySelectorAll("[data-cara]")) if (c.dataset.cara !== lado) c.remove();

  // La huella: crestas concéntricas que salen del logo, como las líneas del
  // propio logo y como la huella de una mano ("in good hands"). Los cortes
  // de cada cresta salen de una semilla fija: siempre la misma tarjeta.
  const s = getComputedStyle(document.documentElement);
  const b = 3.175;
  const W = tam.ancho + 2 * b, H = tam.alto + 2 * b;
  let semilla = 7;
  const azar = () => ((semilla = (semilla * 16807) % 2147483647) / 2147483647);
  const ns = "http://www.w3.org/2000/svg";
  function huella(svg, cx, cy, desde, cuantas) {
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    for (let i = 0; i < cuantas; i++) {
      const rx = desde + i * 2.05, ry = rx * 0.86;
      const largo = 2 * Math.PI * Math.sqrt((rx * rx + ry * ry) / 2);
      const huecos = [];
      let resta = largo;
      while (resta > 0) {
        const trazo = 6 + azar() * 22, hueco = 0.9 + azar() * 2.4;
        huecos.push(trazo.toFixed(2), hueco.toFixed(2));
        resta -= trazo + hueco;
      }
      const e = document.createElementNS(ns, "ellipse");
      e.setAttribute("cx", cx); e.setAttribute("cy", cy);
      e.setAttribute("rx", rx); e.setAttribute("ry", ry);
      e.setAttribute("fill", "none");
      e.setAttribute("stroke", s.getPropertyValue("--huella").trim());
      e.setAttribute("stroke-width", "0.26");
      e.setAttribute("stroke-dasharray", huecos.join(" "));
      e.setAttribute("stroke-dashoffset", (azar() * 30).toFixed(2));
      e.setAttribute("transform", `rotate(${-8 + i * 0.6} ${cx} ${cy})`);
      svg.appendChild(e);
    }
  }
  // Frente: sale del centro del logo. Dorso: asoma desde la esquina de abajo
  // a la derecha, la misma huella vista de cerca.
  const frente = document.getElementById("huella");
  if (frente) huella(frente, b + 5.5 + 15.3, H / 2, 18, 18);
  const dorso = document.getElementById("huella-dorso");
  if (dorso) huella(dorso, W + 6, H + 6, 12, 7);
</script>
</body>
</html>
