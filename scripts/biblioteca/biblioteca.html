<title>Biblioteca Judo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Muro de piezas como un carrete: miniaturas verticales en rejilla, la ficha
   completa en un panel encima. Oscuro primero (la noche morada de Judo). */
:root {
  --bg: #11101a;
  --surface: #1a1826;
  --surface-2: #232031;
  --line: #2f2b42;
  --fg: #f3f1f9;
  --muted: #a7a2ba;
  --accent: #b69bff;
  --accent-strong: #7b2dff;
  --on-accent: #ffffff;
  --ok: #4ade9c;
  --warn: #f5c542;
  --info: #b69bff;
  --gris: #9a96aa;
  --peligro: #ff8a8a;
  --peligro-fondo: #c42b33;
  --shadow: 0 18px 40px -18px rgba(0, 0, 0, .7);
  --f-display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f4f9; --surface: #ffffff; --surface-2: #efedf6; --line: #e1ddec; --fg: #17151f; --muted: #5f5a70;
    --accent: #5b17d9; --accent-strong: #6a1fe6; --on-accent: #ffffff; --ok: #0c7a52; --warn: #8a5d00; --info: #5b17d9; --gris: #6b677a;
    --peligro: #b42029; --peligro-fondo: #b42029;
    --shadow: 0 16px 36px -20px rgba(40, 20, 90, .35); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f4f9; --surface: #ffffff; --surface-2: #efedf6; --line: #e1ddec; --fg: #17151f; --muted: #5f5a70;
  --accent: #5b17d9; --accent-strong: #6a1fe6; --on-accent: #ffffff; --ok: #0c7a52; --warn: #8a5d00; --info: #5b17d9; --gris: #6b677a;
  --peligro: #b42029; --peligro-fondo: #b42029;
  --shadow: 0 16px 36px -20px rgba(40, 20, 90, .35); color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
.envoltura { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 26px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-size: 12.5px; letter-spacing: .01em; }
.oculto { display: none !important; }

/* ── Cabecera ── */
.cabecera { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.sello { width: 52px; height: 52px; border-radius: 14px; background: #0b0a12; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.sello img { width: 36px; height: auto; }
.cabecera .textos { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 260px; }
.antetitulo { font: 500 11.5px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.cabecera h1 { font-size: clamp(26px, 4.4vw, 38px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.cabecera p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.conteo { display: flex; gap: 8px; flex-wrap: wrap; }
.conteo span { padding: 6px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font: 500 12.5px/1 var(--f-mono); color: var(--muted); }
.conteo b { color: var(--fg); font-weight: 500; }

/* ── Filtros ── */
.barra { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 99px; cursor: pointer; font-weight: 500; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.buscar { flex: 0 1 280px; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.buscar input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 0; outline: none; }
.buscar svg { width: 16px; height: 16px; color: var(--muted); flex: none; }

/* ── Muro ── */
.muro { display: flex; flex-direction: column; gap: 34px; }
.seccion { display: flex; flex-direction: column; gap: 14px; }
.titulo-seccion { font: 600 19px/1.2 var(--f-display); letter-spacing: -.01em; display: flex; align-items: baseline; gap: 10px; }
.titulo-seccion span { font: 500 12.5px/1 var(--f-mono); color: var(--muted); }
.rejilla-piezas { display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: 22px 18px; }
@media (max-width: 520px) { .rejilla-piezas { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; } }
.pieza { display: flex; flex-direction: column; gap: 10px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; min-width: 0; }
.miniatura { position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow); transition: transform .25s ease; }
.pieza[data-tipo="carrusel"] .miniatura { aspect-ratio: 4 / 5; }
.pieza[data-tipo="herramienta"] .miniatura { aspect-ratio: 4 / 5; }
.pieza:hover .miniatura { transform: translateY(-3px); }
.miniatura img { width: 100%; height: 100%; object-fit: cover; display: block; }
.miniatura .marca-tiempo { position: absolute; right: 8px; bottom: 8px; padding: 4px 8px; border-radius: 6px; background: rgba(8, 7, 14, .78); color: #fff; font: 500 12px/1 var(--f-mono); }
.miniatura .pedidos-n { position: absolute; left: 8px; top: 8px; padding: 4px 8px; border-radius: 99px; background: var(--warn); color: #1a1300; font: 600 11.5px/1 var(--f-body); }
.herramienta-arte { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(160deg, var(--surface-2), var(--surface)); }
.herramienta-arte svg { width: 44%; height: auto; color: var(--accent); }
.pieza .nombre { font: 600 17px/1.2 var(--f-display); letter-spacing: -.01em; color: var(--fg); }
.pieza .serie { font-size: 13px; color: var(--muted); }
.fila-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.estado { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--f-body); color: var(--muted); }
.estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.estado.aprobado, .estado.listo { color: var(--ok); }
.estado.falta-voz { color: var(--warn); }
.estado.en-revision { color: var(--info); }
.estado.ejemplo { color: var(--gris); }
.fecha { font: 500 12px/1 var(--f-mono); color: var(--muted); }

.vacio { padding: 40px 20px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); text-align: center; }
.vacio b { display: block; color: var(--fg); font: 600 17px/1.3 var(--f-display); margin-bottom: 6px; }

/* ── Ficha (panel encima) ── */
.velo { position: fixed; inset: 0; z-index: 20; background: rgba(6, 5, 12, .62); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding-block: max(24px, env(safe-area-inset-top, 0px)) 40px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.ficha { width: min(1000px, 100%); background: var(--bg); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 28px; padding: 24px; position: relative; }
@media (max-width: 780px) { .ficha { grid-template-columns: minmax(0, 1fr); padding: 18px; gap: 20px; } }
.cerrar { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; z-index: 2; }
.cerrar svg { width: 16px; height: 16px; }
.medio { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.medio video { width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 14px; display: block; }
.laminas { display: grid; grid-auto-flow: column; grid-auto-columns: 86%; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
.laminas img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 12px; scroll-snap-align: start; display: block; }
.ayuda-deslizar { font-size: 12.5px; color: var(--muted); }
.datos { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.datos .serie { font: 500 11.5px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-right: 44px; }
.datos h2 { font-size: clamp(26px, 4vw, 34px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; padding-right: 44px; }
.datos .resumen { margin: 0; color: var(--muted); max-width: 62ch; }
.bloque { display: flex; flex-direction: column; gap: 10px; }
.bloque h3 { font: 600 13px/1 var(--f-body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.tabla-ficha { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 0; }
.tabla-ficha dt { color: var(--muted); font-size: 13.5px; }
.tabla-ficha dd { margin: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.archivos { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.archivo { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); }
.archivo + .archivo { border-top: 1px solid var(--line); }
.archivo .tipo { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); font: 600 10.5px/1 var(--f-mono); color: var(--accent); text-transform: uppercase; }
.archivo .que { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.archivo .que b { font-weight: 600; font-size: 14px; }
.archivo .que span { font: 500 12px/1.3 var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.archivo .botones { display: flex; gap: 6px; flex: none; }
.boton { border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 13.5px; cursor: pointer; background: var(--accent-strong); color: var(--on-accent); white-space: nowrap; }
.boton.suave { background: var(--surface-2); color: var(--fg); }
.boton[disabled] { opacity: .55; cursor: progress; }
.ruta { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.ruta code { flex: 1; min-width: 0; font: 500 13px/1.4 var(--f-mono); overflow-wrap: anywhere; }
.historial { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.historial li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; font-size: 14px; }
.historial time { font: 500 12px/1.6 var(--f-mono); color: var(--muted); }
.pedir textarea { width: 100%; min-height: 88px; resize: vertical; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.pedir .acciones { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.nota { font-size: 13px; color: var(--muted); }
.pedido { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.pedido p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.pedido .pie-pedido { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.pedido .pie-pedido .estado { font-size: 12px; }
.pedido.hecho { opacity: .7; }
.enlace { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; font-size: 12.5px; }
.guion { max-height: 420px; overflow: auto; padding: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.guion h1, .guion h2, .guion h3 { font-size: 16px; margin: 14px 0 6px; }
.guion h1:first-child, .guion h2:first-child { margin-top: 0; }
.guion p, .guion ul { margin: 6px 0; }
.guion table { border-collapse: collapse; width: 100%; font-size: 13px; }
.guion .tabla-guion { overflow-x: auto; }
.guion ol { margin: 6px 0; padding-left: 22px; }
.guion .codigo { margin: 10px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); overflow: hidden; }
.guion .codigo .boton { margin: 8px 8px 0 auto; display: flex; }
.guion pre { margin: 0; padding: 10px 14px 14px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.55 var(--f-mono); }
.guion th, .guion td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); min-width: 110px; }
.editar { display: grid; gap: 10px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.editar label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.editar input, .editar select, .editar textarea { padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.zona-borrar { padding-top: 16px; border-top: 1px solid var(--line); }
.zona-borrar h3 { color: var(--peligro); }
.zona-borrar .acciones { display: flex; gap: 8px; flex-wrap: wrap; }
.boton.peligro { background: var(--peligro-fondo); color: #ffffff; }
.enlace.peligro-texto { color: var(--peligro); font-size: 13.5px; align-self: flex-start; }
.aviso-barra { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 12px; background: var(--fg); color: var(--bg); font-weight: 500; box-shadow: var(--shadow); }
@media (prefers-reduced-motion: reduce) { .miniatura { transition: none; } }
</style>

    <div class="textos">
      <span class="antetitulo">Judo Marketing · Miami</span>
      <h1>Biblioteca de contenido</h1>
      <p>Los videos, carruseles y herramientas que hacemos para redes. Ábrelos, descárgalos o pídeme un cambio desde la ficha de cada uno.</p>

  </header>

  <div class="barra">
    <div class="chips" id="filtros" role="group" aria-label="Qué mostrar">
      <button class="chip" data-filtro="todo" aria-pressed="true">Todo</button>
      <button class="chip" data-filtro="video" aria-pressed="false">Videos</button>
      <button class="chip" data-filtro="carrusel" aria-pressed="false">Carruseles</button>

    <label class="buscar">

      <input id="buscar" type="search" placeholder="Buscar por nombre o marca" aria-label="Buscar">
    </label>
  </div>

  <main class="muro" id="muro" aria-live="polite">
    <div class="vacio" id="cargando"><b>Cargando la biblioteca…</b>Aquí aparecen los videos, carruseles y herramientas en cuanto Claude los sube.</div>

<div class="velo oculto" id="velo">
  <article class="ficha" id="ficha" role="dialog" aria-modal="true" aria-labelledby="ficha-nombre"></article>
</div>
<div class="aviso-barra oculto" id="aviso" role="status"></div>

<script>
(() => {
  const ESTADOS = { "aprobado": "Aprobado", "listo": "Listo para usar", "falta-voz": "Falta tu voz", "en-revision": "En revisión", "ejemplo": "Ejemplo" };
  const TIPOS = { video: "Video", carrusel: "Carrusel", herramienta: "Herramienta" };
  const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const blob = (id) => "/_blob/" + encodeURIComponent(id);
  const fecha = (iso) => { const d = new Date(String(iso).length <= 10 ? iso + "T12:00:00" : iso); return isNaN(d) ? "" : `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; };
  const peso = (b) => !b ? "" : b > 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.round(b / 1024) + " KB";
  const ICONO_HERRAMIENTA = '<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224 128a96 96 0 1 1-96-96 96 96 0 0 1 96 96Z" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24Zm0 192a88 88 0 1 1 88-88 88.1 88.1 0 0 1-88 88Zm40-88a40 40 0 1 1-40-40 40 40 0 0 1 40 40Z"/></svg>';
  const CERRAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';

  let piezas = [], pedidos = [], filtro = "todo", busqueda = "", abierta = null, editando = false, confirmandoBorrar = false;
  let db = null, downloads = null, assets = null, user = null, puedeEditar = false;

  function aviso(texto) {
    const a = $("#aviso"); a.textContent = texto; a.classList.remove("oculto");
    clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.add("oculto"), 4200);
  }

  // ── El muro ──
  function pendientesDe(id) { return pedidos.filter((p) => p.pieza === id && p.estado !== "hecho").length; }
  function renderMuro() {
    const muro = $("#muro");
    const q = busqueda.trim().toLowerCase();
    const visibles = piezas.filter((p) => (filtro === "todo" || p.tipo === filtro) &&
      (!q || [p.nombre, p.serie, p.numero, p.resumen].join(" ").toLowerCase().includes(q)));
    const n = (t) => piezas.filter((p) => p.tipo === t).length;
    $("#conteo").innerHTML = piezas.length
      ? `<span><b>${n("video")}</b> videos</span><span><b>${n("carrusel")}</b> carruseles</span><span><b>${n("herramienta")}</b> herramientas</span>`
      : "";
    if (!piezas.length) {
      muro.innerHTML = `<div class="vacio"><b>Todavía no hay piezas</b>Cuando Claude termine un video o un carrusel, aparece aquí con sus archivos.</div>`;
      return;
    }
    if (!visibles.length) {
      muro.innerHTML = `<div class="vacio"><b>Nada con ese filtro</b>Prueba con «Todo» o con otra palabra.</div>`;
      return;
    }
    // En «Todo», una sección por tipo: así cada rejilla tiene miniaturas de la misma forma
    const grupos = filtro === "todo"
      ? ["video", "carrusel", "herramienta"].map((t) => [t, visibles.filter((p) => p.tipo === t)]).filter(([, l]) => l.length)
      : [[filtro, visibles]];
    const titulos = { video: "Videos", carrusel: "Carruseles", herramienta: "Herramientas" };
    muro.innerHTML = grupos.map(([t, lista]) => `<section class="seccion">${filtro === "todo" ? `<h2 class="titulo-seccion">${titulos[t]} <span>${lista.length}</span></h2>` : ""}<div class="rejilla-piezas">${tarjetas(lista)}</div></section>`).join("");
  }
  function tarjetas(lista) {
    return lista.map((p) => {
      const pend = pendientesDe(p.id);
      const arte = p.portada
        ? `<img src="${blob(p.portada)}" alt="" loading="lazy">`
        : `<span class="herramienta-arte">${ICONO_HERRAMIENTA}</span>`;
      const marca = p.duracion ? `<span class="marca-tiempo">${esc(p.duracion)}</span>` : p.laminas?.length ? `<span class="marca-tiempo">${p.laminas.length} láminas</span>` : "";
      return `<button class="pieza" data-id="${esc(p.id)}" data-tipo="${esc(p.tipo)}" aria-label="Abrir ${esc(p.nombre)}">
        <span class="miniatura">${arte}${marca}${pend ? `<span class="pedidos-n">${pend} ${pend === 1 ? "pedido" : "pedidos"}</span>` : ""}</span>
        <span class="nombre">${esc(p.nombre)}</span>
        <span class="serie">${esc(p.serie)}${p.numero ? " · " + esc(p.numero) : ""}</span>
        <span class="fila-meta"><span class="estado ${esc(p.estado)}">${esc(ESTADOS[p.estado] || p.estado || "")}</span><span class="fecha">${fecha(p.fecha)}</span></span>
      </button>`;
    }).join("");
  }

  // ── Guion en Markdown, sin HTML de afuera (todo se escapa primero) ──
  function md(texto) {
    const lineas = String(texto).split(/\r?\n/);
    let html = "", tabla = [], lista = [], numerada = false, parrafo = [], codigo = null;
    const enLinea = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
    const cerrar = () => {
      // Las líneas seguidas de un párrafo se juntan: el guion viene cortado a 78 columnas
      if (parrafo.length) { html += `<p>${enLinea(parrafo.join(" "))}</p>`; parrafo = []; }
      if (tabla.length) {
        const filas = tabla.filter((f) => !/^\|\s*-{2,}/.test(f)).map((f) => f.replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
        html += `<div class="tabla-guion"><table><thead><tr>${filas[0].map((c) => `<th>${enLinea(c)}</th>`).join("")}</tr></thead><tbody>${filas.slice(1).map((f) => `<tr>${f.map((c) => `<td>${enLinea(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
        tabla = [];
      }
      if (lista.length) { const e = numerada ? "ol" : "ul"; html += `<${e}>${lista.map((l) => `<li>${enLinea(l)}</li>`).join("")}</${e}>`; lista = []; }
    };
    for (const l of lineas) {
      // Un bloque entre ``` (un pie de foto) se muestra tal cual, con sus saltos de línea y un botón para copiarlo
      if (/^```/.test(l)) {
        if (codigo === null) { cerrar(); codigo = []; }
        else { html += `<div class="codigo"><button class="boton suave" data-copiar>Copiar</button><pre>${esc(codigo.join("\n"))}</pre></div>`; codigo = null; }
        continue;
      }
      if (codigo !== null) { codigo.push(l); continue; }
      if (/^\|/.test(l)) { if (lista.length || parrafo.length) cerrar(); tabla.push(l); continue; }
      const item = l.match(/^\s*(-|\d+\.)\s+(.*)/);
      if (item) {
        const n = item[1] !== "-";
        if (tabla.length || parrafo.length || (lista.length && n !== numerada)) cerrar();
        numerada = n; lista.push(item[2]); continue;
      }
      if (/^\s{2,}\S/.test(l) && lista.length) { lista[lista.length - 1] += " " + l.trim(); continue; }
      const h = l.match(/^(#{1,3})\s+(.*)/);
      if (h) { cerrar(); html += `<h${h[1].length + 1}>${enLinea(h[2])}</h${h[1].length + 1}>`; continue; }
      if (!l.trim()) { cerrar(); continue; }
      if (tabla.length || lista.length) cerrar();
      parrafo.push(l.trim());
    }
    cerrar();
    return html;
  }

  // ── La ficha ──
  function abrir(id, empujar = true) {
    const p = piezas.find((x) => x.id === id);
    if (!p) return;
    abierta = id; editando = false; confirmandoBorrar = false;
    renderFicha();
    $("#velo").classList.remove("oculto");
    document.body.style.overflow = "hidden";
    if (empujar && location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    setTimeout(() => $("#ficha .cerrar")?.focus(), 30);
  }
  function cerrarFicha() {
    const v = $("#ficha video"); if (v) v.pause();
    abierta = null; $("#velo").classList.add("oculto"); document.body.style.overflow = "";
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    const b = document.querySelector(`.pieza[data-id="${CSS.escape(lastOpened || "")}"]`); b?.focus();
  }
  let lastOpened = null;

  function renderFicha() {
    const p = piezas.find((x) => x.id === abierta);
    const f = $("#ficha");
    if (!p) { cerrarFicha(); return; }
    lastOpened = p.id;
    const suyos = pedidos.filter((x) => x.pieza === p.id).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
    let medio = "";
    if (p.tipo === "video" && p.principal) {
      medio = `<video id="reproductor" controls playsinline preload="metadata" ${p.portada ? `poster="${blob(p.portada)}"` : ""} src="${blob(p.principal)}"></video>`;
    } else if (p.laminas?.length) {
      medio = `<div class="laminas" tabindex="0" aria-label="Láminas del carrusel">${p.laminas.map((id, i) => `<img src="${blob(id)}" alt="Lámina ${i + 1}" loading="lazy">`).join("")}</div><span class="ayuda-deslizar">Desliza para ver las ${p.laminas.length} láminas.</span>`;
    } else {
      medio = `<div class="miniatura" style="aspect-ratio:4/5"><span class="herramienta-arte">${ICONO_HERRAMIENTA}</span></div>`;
    }
    const ficha = (p.ficha || []).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
    const archivos = (p.archivos || []).map((a, i) => `
      <div class="archivo">
        <span class="tipo">${esc(a.formato || "")}</span>
        <span class="que"><b>${esc(a.etiqueta)}</b><span>${esc(a.nombre)}${a.bytes ? " · " + peso(a.bytes) : ""}</span></span>
        <span class="botones">
          ${a.formato === "md" ? `<button class="boton suave" data-ver-guion="${i}">Leer</button>` : ""}
          <button class="boton" data-bajar="${i}">Descargar</button>
        </span>
      </div>`).join("");
    const historial = (p.historial || []).slice().reverse().map((h) => `<li><time>${fecha(h.fecha)}</time><span>${esc(h.nota)}</span></li>`).join("");
    const listaPedidos = suyos.map((x) => `
      <div class="pedido ${x.estado === "hecho" ? "hecho" : ""}">
        <p>${esc(x.texto)}</p>
        <span class="pie-pedido"><span class="estado ${x.estado === "hecho" ? "listo" : "falta-voz"}">${x.estado === "hecho" ? "Hecho" : "Pendiente"}</span><span>${fecha(x.fecha)}</span>
        ${puedeEditar ? `<button class="enlace" data-alternar="${esc(x.id)}">${x.estado === "hecho" ? "Marcar pendiente" : "Marcar hecho"}</button>` : ""}</span>
      </div>`).join("");
    const formEditar = editando ? `
      <form class="editar" id="form-editar">
        <label for="e-nombre">Nombre<input id="e-nombre" value="${esc(p.nombre)}" maxlength="80" required></label>
        <label for="e-estado">Estado<select id="e-estado">${Object.entries(ESTADOS).map(([k, v]) => `<option value="${k}" ${k === p.estado ? "selected" : ""}>${v}</option>`).join("")}</select></label>
        <label for="e-resumen">De qué trata<textarea id="e-resumen" rows="3" maxlength="400">${esc(p.resumen)}</textarea></label>
        <span class="acciones" style="display:flex;gap:8px;flex-wrap:wrap"><button class="boton" type="submit">Guardar</button><button class="boton suave" type="button" id="cancelar-editar">Cancelar</button></span>
      </form>` : "";
    // Si el video ya está en pantalla, se conserva: un pedido nuevo no lo corta a la mitad
    const viejo = $("#reproductor");
    const conservar = viejo && p.principal && viejo.getAttribute("src") === blob(p.principal) ? viejo : null;
    if (conservar) conservar.remove();
    f.innerHTML = `
      <button class="cerrar" aria-label="Cerrar">${CERRAR}</button>
      <div class="medio">${medio}</div>
      <div class="datos">
        <div style="display:flex;flex-direction:column;gap:8px">
          <span class="serie">${esc(TIPOS[p.tipo] || "")} · ${esc(p.serie)}${p.numero ? " · " + esc(p.numero) : ""}</span>
          <h2 id="ficha-nombre">${esc(p.nombre)}</h2>
          <span class="fila-meta"><span class="estado ${esc(p.estado)}">${esc(ESTADOS[p.estado] || "")}</span><span class="fecha">${fecha(p.fecha)}</span>
            ${puedeEditar && !editando ? `<button class="enlace" id="editar">Editar nombre y estado</button>` : ""}</span>
          ${p.resumen ? `<p class="resumen">${esc(p.resumen)}</p>` : ""}
        </div>
        ${formEditar}
        ${ficha ? `<section class="bloque"><h3>Ficha</h3><dl class="tabla-ficha">${ficha}</dl></section>` : ""}
        ${archivos ? `<section class="bloque"><h3>Archivos</h3><div class="archivos">${archivos}</div><span class="nota" id="nota-descarga"></span></section>` : ""}
        <section class="bloque oculto" id="bloque-guion"><h3 id="titulo-guion">Guion</h3><div class="guion" id="guion"></div></section>
        <section class="bloque pedir">
          <h3>Pedir un cambio</h3>
          <label for="texto-pedido" class="nota">Escribe qué quieres cambiar y en qué parte (por ejemplo, «escena 2, el árbitro más grande»).</label>
          <textarea id="texto-pedido" maxlength="2000"></textarea>
          <span class="acciones"><button class="boton" id="enviar-pedido">Guardar pedido</button><span class="nota" id="nota-pedido">Después dile a Claude «revisa los pedidos de la biblioteca».</span></span>
          ${listaPedidos ? `<div style="display:flex;flex-direction:column;gap:8px">${listaPedidos}</div>` : ""}
        </section>
        ${p.ruta ? `<section class="bloque"><h3>Dónde vive en el repositorio</h3><div class="ruta"><code id="ruta">${esc(p.ruta)}</code><button class="boton suave" id="copiar-ruta">Copiar</button></div>${p.comoCambiar ? `<span class="nota">${esc(p.comoCambiar)}</span>` : ""}</section>` : ""}
        ${puedeEditar && assets && p.tipo !== "herramienta" ? `<section class="bloque"><h3>Subir una versión nueva</h3><span class="nota">Un MP4, una imagen o un PDF. Queda arriba en «Archivos» y se anota en el historial.</span><input type="file" id="subir" accept="video/mp4,image/png,image/jpeg,image/webp,application/pdf"></section>` : ""}
        ${historial ? `<section class="bloque"><h3>Historial</h3><ul class="historial">${historial}</ul></section>` : ""}
        ${puedeEditar ? `<section class="bloque zona-borrar">${confirmandoBorrar ? `
          <h3>¿Borrar «${esc(p.nombre)}»?</h3>
          <p class="nota" style="margin:0">Se borran su ficha, ${idsDe(p).length === 1 ? "su archivo" : `sus ${idsDe(p).length} archivos`} y sus pedidos de la biblioteca, para todos los que la abren. Desde aquí no se puede deshacer. Lo que está en el repositorio no se toca.</p>
          <span class="acciones"><button class="boton peligro" id="confirmar-borrar">Sí, borrar</button><button class="boton suave" id="cancelar-borrar">Cancelar</button></span>`
          : `<button class="enlace peligro-texto" id="borrar">Borrar de la biblioteca</button>`}</section>` : ""}
      </div>`;
    if (conservar) $("#reproductor")?.replaceWith(conservar);
  }

  async function descargar(i, boton) {
    const p = piezas.find((x) => x.id === abierta); const a = p?.archivos?.[i];
    const nota = $("#nota-descarga");
    if (!a) return;
    if (!downloads) { if (nota) nota.textContent = "Las descargas no están disponibles en esta vista. Abre la biblioteca en claude.ai."; return; }
    const antes = boton.textContent; boton.disabled = true; boton.textContent = "Preparando…";
    try {
      const r = await fetch(blob(a.id));
      if (!r.ok) throw { code: "missing" };
      let data;
      if (a.formato === "zip") {
        // Las skills se guardan como texto (base64): el almacén no acepta .zip
        const txt = (await r.text()).trim(); const bin = atob(txt); const bytes = new Uint8Array(bin.length);
        for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
        data = new Blob([bytes]);
      } else data = await r.blob();
      await downloads.save({ filename: a.nombre, data });
      if (nota) nota.textContent = `«${a.nombre}» guardado.`;
    } catch (e) {
      const c = e?.code;
      if (nota) nota.textContent = c === "declined" ? "Cancelaste la descarga." : c === "missing" ? "No encuentro ese archivo. Pídele a Claude que lo vuelva a subir." : c === "rate_limited" ? "Ya hay una descarga esperando tu respuesta. Termínala y vuelve a intentar." : "No se pudo descargar en esta vista. Prueba en claude.ai desde la computadora.";
    } finally { boton.disabled = false; boton.textContent = antes; }
  }

  async function verGuion(i) {
    const p = piezas.find((x) => x.id === abierta); const a = p?.archivos?.[i];
    const caja = $("#guion"), bloque = $("#bloque-guion");
    bloque.classList.remove("oculto"); $("#titulo-guion").textContent = a.etiqueta; caja.textContent = "Cargando…";
    try { const r = await fetch(blob(a.id)); if (!r.ok) throw 0; caja.innerHTML = md(await r.text()); }
    catch { caja.textContent = "No se pudo abrir el guion."; }
    bloque.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  async function enviarPedido() {
    const t = $("#texto-pedido"); const nota = $("#nota-pedido"); const texto = t.value.trim();
    if (!texto) { nota.textContent = "Escribe el cambio antes de guardarlo."; t.focus(); return; }
    if (!db) { nota.textContent = "Para guardar pedidos tienes que abrir la biblioteca con tu cuenta de claude.ai."; return; }
    const b = $("#enviar-pedido"); b.disabled = true;
    try {
      const autor = user ? await user.id().catch(() => null) : null;
      await db.collection("pedidos").add({ pieza: abierta, texto, fecha: new Date().toISOString(), estado: "pendiente", autor });
      t.value = ""; aviso("Pedido guardado. Dile a Claude «revisa los pedidos de la biblioteca».");
    } catch (e) {
      nota.textContent = e?.code === "permission_denied" ? "Tu acceso a esta biblioteca es de solo lectura: pídele a Junior que te dé permiso de editar." : "No se pudo guardar. Inténtalo otra vez en un momento.";
    } finally { b.disabled = false; }
  }

  async function alternarPedido(id) {
    const x = pedidos.find((y) => y.id === id); if (!x || !db) return;
    try { await db.doc("pedidos/" + id).update({ estado: x.estado === "hecho" ? "pendiente" : "hecho" }); }
    catch { aviso("No se pudo cambiar el pedido."); }
  }

  async function guardarEdicion(ev) {
    ev.preventDefault();
    const p = piezas.find((x) => x.id === abierta); if (!p || !db) return;
    const nombre = $("#e-nombre").value.trim(), estado = $("#e-estado").value, resumen = $("#e-resumen").value.trim();
    if (!nombre) return;
    const historial = (p.historial || []).concat(nombre !== p.nombre ? [{ fecha: new Date().toISOString().slice(0, 10), nota: `Cambió de nombre: «${p.nombre}» → «${nombre}».` }] : []);
    try { await db.doc("piezas/" + p.id).update({ nombre, estado, resumen, historial }); editando = false; aviso("Guardado."); }
    catch { aviso("No se pudo guardar el cambio."); }
  }

  async function subirVersion(input) {
    const file = input.files?.[0]; const p = piezas.find((x) => x.id === abierta);
    if (!file || !p || !assets || !db) return;
    const tipos = { "video/mp4": "mp4", "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "application/pdf": "pdf" };
    const formato = tipos[file.type];
    if (!formato) { aviso("Ese tipo de archivo no se puede subir aquí: usa MP4, PNG, JPG, WebP o PDF."); return; }
    input.disabled = true; aviso("Subiendo «" + file.name + "»…");
    try {
      const r = await assets.upload(file, { type: file.type });
      const hoy = new Date().toISOString().slice(0, 10);
      const archivo = { etiqueta: "Versión nueva (" + fecha(hoy) + ")", nombre: file.name, id: r.id, bytes: r.sizeBytes, formato };
      const cambios = { archivos: [archivo].concat(p.archivos || []), historial: (p.historial || []).concat([{ fecha: hoy, nota: `Se subió una versión nueva: ${file.name}.` }]) };
      if (formato === "mp4" && p.tipo === "video") cambios.principal = r.id;
      await db.doc("piezas/" + p.id).update(cambios);
      aviso("Listo: la versión nueva quedó arriba en «Archivos».");
    } catch (e) {
      aviso(e?.code === "too_large" ? "Ese archivo pasa de 20 MB. Comprímelo o pídeselo a Claude." : "No se pudo subir. Inténtalo otra vez.");
    } finally { input.disabled = false; input.value = ""; }
  }

  // Los archivos de una pieza (sin repetir): portada, video, láminas y lista de archivos
  function idsDe(p) {
    return [...new Set([p.portada, p.principal, ...(p.laminas || []), ...(p.archivos || []).map((a) => a.id)].filter(Boolean))];
  }

  async function borrarPieza(boton) {
    const p = piezas.find((x) => x.id === abierta); if (!p || !db) return;
    boton.disabled = true; boton.textContent = "Borrando…";
    // Un archivo que también usa otra pieza se queda
    const enOtras = new Set(piezas.filter((x) => x.id !== p.id).flatMap(idsDe));
    const archivos = idsDe(p).filter((id) => !enOtras.has(id));
    const nombre = p.nombre, suyos = pedidos.filter((x) => x.pieza === p.id);
    try { await db.doc("piezas/" + p.id).delete(); }
    catch { boton.disabled = false; boton.textContent = "Sí, borrar"; aviso("No se pudo borrar. Inténtalo otra vez en un momento."); return; }
    confirmandoBorrar = false;
    cerrarFicha();
    for (const x of suyos) { try { await db.doc("pedidos/" + x.id).delete(); } catch {} }
    let quedaron = 0;
    if (assets) for (const id of archivos) { try { await assets.delete(id); } catch { quedaron++; } }
    else quedaron = archivos.length;
    aviso(quedaron
      ? `«${nombre}» se borró de la biblioteca. ${quedaron === 1 ? "Un archivo quedó" : quedaron + " archivos quedaron"} guardado${quedaron === 1 ? "" : "s"} sin mostrarse: Claude los puede limpiar.`
      : `«${nombre}» se borró de la biblioteca.`);
  }

  async function copiarRuta() {
    const t = $("#ruta").textContent;
    try { await navigator.clipboard.writeText(t); aviso("Ruta copiada."); }
    catch { const r = document.createRange(); r.selectNodeContents($("#ruta")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); aviso("Selecciona y copia la ruta."); }
  }

  async function copiarBloque(b) {
    const pre = b.nextElementSibling;
    try { await navigator.clipboard.writeText(pre.textContent); aviso("Copiado."); }
    catch { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); aviso("Texto seleccionado: cópialo."); }
  }

  // ── Eventos ──
  $("#filtros").addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    filtro = b.dataset.filtro;
    for (const c of document.querySelectorAll("#filtros .chip")) c.setAttribute("aria-pressed", String(c === b));
    renderMuro();
  });
  $("#buscar").addEventListener("input", (e) => { busqueda = e.target.value; renderMuro(); });
  $("#muro").addEventListener("click", (e) => { const b = e.target.closest(".pieza"); if (b) abrir(b.dataset.id); });
  $("#velo").addEventListener("click", (e) => { if (e.target.id === "velo") cerrarFicha(); });
  $("#ficha").addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest(".cerrar")) return cerrarFicha();
    const bajar = t.closest("[data-bajar]"); if (bajar) return descargar(Number(bajar.dataset.bajar), bajar);
    const ver = t.closest("[data-ver-guion]"); if (ver) return verGuion(Number(ver.dataset.verGuion));
    if (t.closest("#enviar-pedido")) return enviarPedido();
    const alt = t.closest("[data-alternar]"); if (alt) return alternarPedido(alt.dataset.alternar);
    if (t.closest("#copiar-ruta")) return copiarRuta();
    const cp = t.closest("[data-copiar]"); if (cp) return copiarBloque(cp);
    if (t.closest("#editar")) { editando = true; return renderFicha(); }
    if (t.closest("#cancelar-editar")) { editando = false; return renderFicha(); }
    if (t.closest("#borrar")) { confirmandoBorrar = true; renderFicha(); return $("#confirmar-borrar")?.focus(); }
    if (t.closest("#cancelar-borrar")) { confirmandoBorrar = false; return renderFicha(); }
    const conf = t.closest("#confirmar-borrar"); if (conf) return borrarPieza(conf);
  });
  $("#ficha").addEventListener("submit", (e) => { if (e.target.id === "form-editar") guardarEdicion(e); });
  $("#ficha").addEventListener("change", (e) => { if (e.target.id === "subir") subirVersion(e.target); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && abierta) cerrarFicha(); });
  window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && id !== abierta) abrir(id, false); else if (!id && abierta) cerrarFicha(); });

  // ── Datos ──
  (async () => {
    db = await claude.use("db");
    if (!db) {
      $("#muro").innerHTML = `<div class="vacio"><b>Abre la biblioteca con tu cuenta</b>Las piezas se ven al entrar con tu cuenta de claude.ai.</div>`;
      return;
    }
    db.collection("piezas").orderBy("orden", "desc").onSnapshot((snap) => {
      piezas = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderMuro();
      const id = location.hash.slice(1);
      if (abierta) { if (!editando && !document.activeElement?.closest?.("#ficha textarea, #ficha input, #ficha select")) renderFicha(); }
      else if (id && piezas.some((p) => p.id === id)) abrir(id, false);
    }, () => { $("#muro").innerHTML = `<div class="vacio"><b>No se pudo cargar la biblioteca</b>Recarga la página en un momento.</div>`; });
    db.collection("pedidos").onSnapshot((snap) => {
      pedidos = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderMuro();
      if (abierta && !editando && !document.activeElement?.closest?.("#ficha textarea, #ficha input, #ficha select")) renderFicha();
    }, () => {});
  })();
  claude.use("downloads").then((d) => { downloads = d; });
  claude.use("assets").then((a) => { assets = a; if (abierta) renderFicha(); });
  claude.use("user").then(async (u) => { user = u; puedeEditar = Boolean(await u?.canEdit?.().catch(() => false)); if (abierta) renderFicha(); });
})();
</script>
